# ============================================================================
# СПРАВОЧНИКИ ТЕХПРИЛОЖЕНИЯ ЛЦТ-2026 (кейс ДИТ «Трассы тепловых сетей»)
# Актуальная редакция технического приложения (сентябрь 2026).
#
# Все значения — из официального технического приложения:
#   таблица 1 — ДУ: пропускная способность / предельная длина / ставка /
#               расчётный габарит (ширина пары труб, высота);
#   таблица 2 — правила пространственных ограничений и Kспец;
#   §3.2      — стоимость камер и врезок в существующие камеры;
#   §5        — дополнительный режим с учётом глубины (Kгл);
#   §6        — стоимость варианта, штраф за неподключённую точку,
#               итоговый показатель S.
# Реконструкция существующей сети и камер ОТМЕНЕНА (§2.4, разъяснение №14).
# Никаких констант в коде: правится только этот файл.
# ============================================================================

