# Таблица 1 (продолжение): расчётные габариты (ширина пары труб / высота), м.
# Отступы таблицы 2 считаются от границы ограничения до ВНЕШНЕЙ границы
# расчётного габарита — при проверке расстояния от оси трассы добавляется
# половина расчётной ширины (§3.1).
