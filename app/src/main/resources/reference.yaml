  - { dn_mm: 1400, width_m: 3.45, height_m: 1.600 }

# Таблица 2: правила пространственных ограничений по restriction_type.
#   rule: forbidden — пересечение запрещено (с мин. расстоянием);
#         special   — допускается специальный проход с Kспец.
#   extent_mode: polygon — границы спецучастка = полигон + extent_m с каждой
#         стороны; point — ±extent_m от точки пересечения.
restrictions:
  # ОКС (полигоны передаются как restriction с restriction_type = oks).
  # Непроходимое препятствие; отступ ступенями по ДУ новой сети.
  oks:
    rule: forbidden
    # 5 м при ДУ <500 мм; 7 м при 500–800 мм; 9 м при ≥900 мм
    min_distance_by_dn:
      - { max_dn_mm: 499,  distance_m: 5.0 }
      - { max_dn_mm: 800,  distance_m: 7.0 }
      - { max_dn_mm: 9999, distance_m: 9.0 }
  # Синоним ранних наборов данных (та же правовая норма).
  oks_existing:
    rule: forbidden
    min_distance_by_dn:
      - { max_dn_mm: 499,  distance_m: 5.0 }
      - { max_dn_mm: 800,  distance_m: 7.0 }
      - { max_dn_mm: 9999, distance_m: 9.0 }
  park:
    rule: forbidden
    min_distance_m: 1.0
  social_area:
    rule: forbidden
    min_distance_m: 1.0
  prohibited_site:
    rule: forbidden
    min_distance_m: 1.0
  water:
    rule: forbidden
    min_distance_m: 1.0
  railway:
    rule: forbidden
    min_distance_m: 1.0
  road:
    rule: special
    min_distance_m: 1.5
    min_angle_deg: 45
    extent_m: 3.0
    extent_mode: polygon        # полигон дороги + 3 м за границей с каждой стороны
    k_special: 1.60
    under_clearance_m: 1.0      # режим глубины: верх габарита ≥ 1,0 м (под объектом)
  tram_tracks:
    rule: special
    min_distance_m: 1.5
    min_angle_deg: 45
    extent_m: 3.0
    extent_mode: polygon
    k_special: 1.75
    under_clearance_m: 1.2
  gas_pipeline:
    rule: special
    min_distance_m: 2.0
    extent_m: 2.0
    extent_mode: point          # ±2 м от точки пересечения
    k_special: 1.25
    vertical_clearance_m: 0.2   # режим глубины: выше или ниже, просвет ≥ 0,2 м
  power_cable:
    rule: special
    min_distance_m: 2.0
    extent_m: 2.0
    extent_mode: point
    k_special: 1.15
    vertical_clearance_m: 0.5
  heat_network:
    rule: special
    min_distance_m: 1.0
    extent_m: 2.0
    extent_mode: point
    k_special: 1.05
    vertical_clearance_m: 0.5

# Стоимости (§3.2, §6), руб.
tariffs_rub:
  # §3.2: врезка в СУЩЕСТВУЮЩУЮ камеру — 5 млн ₽ за КАЖДЫЙ новый линейный
  # участок, заканчивающийся в ней. При строительстве новой камеры
  # отдельная стоимость врезки не добавляется (включена в камеру).
  tie_in_existing_chamber: 5000000
  # §3.2: стоимость НОВОЙ камеры по наибольшему ДУ примыкающих участков
  # (включая существующие). Включает присоединение к существующей сети.
  chamber_cost_scale:
    - { max_dn_mm: 200,  cost_rub: 3000000 }
    - { max_dn_mm: 500,  cost_rub: 5000000 }
    - { max_dn_mm: 1000, cost_rub: 8000000 }
    - { max_dn_mm: 1400, cost_rub: 12000000 }
  technical_node: 0          # техузел отдельной стоимостью не тарифицируется
  # §6: штраф за каждую неподключённую точку = 100 млн + 500 тыс. × G, т/ч
  unconnected_penalty_base: 100000000
  unconnected_penalty_per_tph: 500000

# §6: итоговый показатель S = 0,7·(C / 25 000 000) + 0,3·(L / 100),
# C = calculated_cost, L = new_network_length (только новые участки).
# Меньше — лучше.
scoring:
  weight_cost: 0.7
  weight_length: 0.3
  cost_norm_rub: 25000000    # 25 млн ₽
  length_norm_m: 100         # 100 м

# Правила алгоритма (не из техприложения — параметры решения).
rules:
  chamber_tap_max_dist_m: 10        # §2.4: точка присоединения ≤10 м от камеры
  chamber_snap_m: 1.0               # допуск геометрической привязки концов
                                    # участков к камере (подсчёт примыканий §2.1)
  max_chamber_connections: 4        # §2.1: лимит примыкающих участков
  max_new_directions_per_chamber: 3 # из них в новых направлениях (ветвление)
  cluster_radius_m: 300             # радиус кластеризации точек под общий ствол
  chain_group_max_flow_tph: 152     # цепочный ствол: потолок расхода пакета (ДУ200)
  tap_search_radius_m: 1500         # радиус поиска точек присоединения
  grid_cell_m: 3                    # шаг сетки маршрутизации (ТЗ: 3 м)
  turn_penalty_m: 25                # штраф A* за поворот (против зигзагов §2.1)
  simplify_tolerance_m: 0.4         # допуск упрощения трассы (ранее 0,75·ячейки
                                    # срезал углы до 2,25 м и ломал отступы §3.1)
  clearance_retry_max_m: 4          # лестница перероута 0/+1/+2/+N м запаса
                                    # к буферу отступа при точной проверке §3.1
  corridor_avoid_radius_m: 30       # вариант «альтернативный коридор»
  corridor_avoid_factor: 3.0
  special_passage_min_len_m: 2      # короче — не выделять отдельным участком
  own_oks_max_detour: 1.35          # финальный подход к своему полигону ОКС:
                                    # прямой хвост ≤ ×1,35 длины обхода (§2.2)

# ============================================================================
# §5: дополнительный режим с учётом глубины.
# Активируется ENGINE_DEPTH_MODE=1; в базовом 2D-режиме depth_start/end=null,
# Kгл = 1. Z-координаты не формируются — только атрибуты глубины.
# ============================================================================
depth:
  base_depth_m: 3.0          # обычная глубина до ВЕРХА расчётного габарита
  min_depth_m: 0.7           # минимально допустимая глубина
  max_slope: 0.10            # максимальный уклон спуска/подъёма (м/м)
  crossing_flat_m: 4.0       # горизонтальная площадка на точечном пересечении
  depth_cost_rate: 0.10      # Kгл = 1 + 0,10·(h − 3) при h > 3 м
  free_depth_m: 3.0          # при h ≤ 3,0 м Kгл = 1
  # Условные габариты и глубины существующих коммуникаций (§4, таблица 2):
  # глубина до ВЕРХА габарита; просвет — между внешними гранями габаритов.
  existing_utilities:
    gas_pipeline:  { depth_top_m: 2.8, width_m: 0.40, height_m: 0.40 }
    power_cable:   { depth_top_m: 2.7, width_m: 0.20, height_m: 0.20 }
    heat_network:  { depth_top_m: 3.0 }   # габарит — по таблице 1 (ДУ участка)
