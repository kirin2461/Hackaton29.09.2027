  - { dn_mm: 600,  max_flow_tph: 2627.7,  max_len_m: 4037,  cost_new_rub_m: 264790 }
  - { dn_mm: 700,  max_flow_tph: 3735.1,  max_len_m: 4775,  cost_new_rub_m: 324298 }
  - { dn_mm: 800,  max_flow_tph: 5296.8,  max_len_m: 5644,  cost_new_rub_m: 325996 }
