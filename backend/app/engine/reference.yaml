# ============================================================================
# СПРАВОЧНИКИ ТЕХПРИЛОЖЕНИЯ К ТЗ (кейс ДИТ, Спринт 2)
#
# ⚠️  ВНИМАНИЕ: значения — инженерно-правдоподобные ПЛАЦЕЙСТОЛБЦЫ.
# Когда будет предоставлено техприложение, таблицы ниже заменяются на
# конкурсные БЕЗ изменения кода (§2.14 ТЗ: никаких констант набора в коде).
# ============================================================================

# Пропускная способность и предельные длины по условным диаметрам.
# Подбор: минимальный Ду, чья пропускная способность >= требуемого расхода.
# Предельная длина — максимум непрерывной части одного диаметра;
# при превышении — техузел и отсчёт заново.
diameters:
  - { dn_mm: 100, max_flow_tph: 30,   max_len_m: 400 }
  - { dn_mm: 150, max_flow_tph: 70,   max_len_m: 500 }
  - { dn_mm: 200, max_flow_tph: 130,  max_len_m: 600 }
  - { dn_mm: 250, max_flow_tph: 210,  max_len_m: 700 }
  - { dn_mm: 300, max_flow_tph: 310,  max_len_m: 800 }
  - { dn_mm: 400, max_flow_tph: 570,  max_len_m: 900 }
  - { dn_mm: 500, max_flow_tph: 920,  max_len_m: 1000 }
  - { dn_mm: 600, max_flow_tph: 1350, max_len_m: 1200 }
  - { dn_mm: 800, max_flow_tph: 2500, max_len_m: 1500 }
  - { dn_mm: 1000, max_flow_tph: 4000, max_len_m: 2000 }

# Тарифы и стоимости (руб.)
tariffs_rub:
  # Прокладка нового участка, ₽/м по диаметру (двухтрубная, открытым способом)
  lay_per_m:
    100: 95000
    150: 110000
    200: 130000
    250: 150000
    300: 170000
    400: 210000
    500: 250000
    600: 290000
    800: 370000
    1000: 450000
  chamber_new: 1500000              # строительство новой камеры
  tapping_existing_chamber: 250000  # врезка в существующую камеру
  technical_node: 900000            # технический узел (при предельной длине)
  chamber_reconstruction: 700000    # реконструкция камеры (перегруз примыканий)
  reconstruction_per_m_multiplier: 0.8  # реконструкция участка: доля от стоимости новой прокладки
  special_passage_multiplier: 2.5   # спецпроход (закрытый способ и т.п.): множитель к ₽/м
  unconnected_penalty: 50000000     # штраф за каждый неподключённый ОКС

# Правила пространственных ограничений и параметры алгоритма.
rules:
  max_chamber_connections: 4        # лимит примыканий к камере
  max_new_directions_per_chamber: 3 # из них в новых направлениях
  crossing_min_angle_deg: 45        # пересечение с условиями: минимальный угол
  cluster_radius_m: 300             # радиус кластеризации ОКС под общий ствол
  tap_search_radius_m: 1500         # радиус поиска точек врезки
  grid_cell_m: 5                    # размер ячейки весовой сетки
  turn_penalty_m: 10                # штраф за поворот 45° (в метрах эквивалента)
  special_passage_min_len_m: 20     # короче — не выделять отдельным участком

# ============================================================================
# ЗАДАНИЕ НА ГЛУБУНУ (доп. задача, Спринт 4): вертикальные правила.
# Отметки Z — в метрах ниже поверхности, дискретизация 0.5 м.
# ============================================================================
depth:
  base_depth_m: 1.5          # минимальная глубина заложения (до верха трубы)
  step_m: 0.5                # шаг дискретизации отметок глубины
  per_diameter_m:            # добавка к глубине по диаметру (габарит + запас)
    100: 0.0
    150: 0.0
    200: 0.2
    250: 0.3
    300: 0.5
    400: 0.7
    500: 1.0
    600: 1.2
    800: 1.5
    1000: 2.0
  max_slope_pct: 10.0        # максимальный продольный уклон при смене глубины
  chamber_drop_m: 0.5        # понижение отметки дна камеры ниже трубы
  deep_threshold_m: 3.5      # глубже — «глубокая» прокладка
  deep_multiplier: 1.25      # множитель стоимости земляных работ для глубокой
