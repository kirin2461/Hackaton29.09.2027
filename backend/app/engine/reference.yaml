# ============================================================================
# СПРАВОЧНИКИ ТЕХПРИЛОЖЕНИЯ ЛЦТ-2026 (кейс ДИТ «Трассы тепловых сетей»)
#
# Все значения — из официального технического приложения:
#   таблица 4.1 — диаметры/расходы/предельные длины/ставки;
#   таблица 4.2 — расчётные габариты (ширина пары труб, высота);
#   таблица 5.1 — правила пространственных ограничений и Kспец;
#   раздел 8.2  — стоимость врезки и шкала стоимости камер;
#   раздел 8.3  — штраф за неподключённый ОКС;
#   раздел 9    — формула итогового показателя S.
# Никаких констант в коде (§2.14 ТЗ): правится только этот файл.
# ============================================================================

