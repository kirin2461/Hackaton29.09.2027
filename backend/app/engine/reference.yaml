# Таблица 5.1: правила пространственных ограничений по restriction_type.
#   rule: forbidden — пересечение запрещено (с мин. расстоянием);
#         special   — допускается специальный проход с Kспец.
#   extent_mode: polygon — границы спецучастка = полигон + extent_m с каждой
#         стороны; point — ±extent_m от точки пересечения.
restrictions:
  oks_existing:
    rule: forbidden
    # 5 м при Ду новой сети <500 мм; 7 м при 500–800 мм; 9 м при ≥900 мм
    min_distance_by_dn:
      - { max_dn_mm: 499,  distance_m: 5.0 }
      - { max_dn_mm: 800,  distance_m: 7.0 }
      - { max_dn_mm: 9999, distance_m: 9.0 }
  park:
    rule: forbidden
    min_distance_m: 1.0
  social_area:
    rule: forbidden
    min_distance_m: 1.0
  prohibited_site:
    rule: forbidden
    min_distance_m: 1.0
  water:
    rule: forbidden
    min_distance_m: 1.0
  road:
    rule: special
    min_distance_m: 1.5
    min_angle_deg: 45
    extent_m: 3.0
    extent_mode: polygon
    k_special: 1.60
    under_clearance_m: 1.0     # верх габарита ≥ 1,0 м ниже условной поверхности
  tram_tracks:
    rule: special
    min_distance_m: 1.5
    min_angle_deg: 45
    extent_m: 3.0
    extent_mode: polygon
    k_special: 1.75
    under_clearance_m: 1.2
  gas_pipeline:
    rule: special
    min_distance_m: 2.0
    extent_m: 2.0
    extent_mode: point
    k_special: 1.25
    vertical_clearance_m: 0.2  # выше или ниже; мин. вертикальный просвет
  power_cable:
    rule: special
    min_distance_m: 2.0
    extent_m: 2.0
    extent_mode: point
    k_special: 1.15
    vertical_clearance_m: 0.5
  heat_network:
    rule: special
    min_distance_m: 1.0
    extent_m: 2.0
    extent_mode: point
    k_special: 1.05
    vertical_clearance_m: 0.5

# Тарифы и стоимости (раздел 8 техприложения), руб.
tariffs_rub:
  tie_in: 5000000            # §8.2: каждая врезка — 5 млн ₽ (и в камеру, и с новой камерой)
  # §8.2: стоимость камеры по наибольшему Ду примыкающих участков
  chamber_cost_scale:
    - { max_dn_mm: 200,  cost_rub: 3000000 }
    - { max_dn_mm: 500,  cost_rub: 5000000 }
    - { max_dn_mm: 1000, cost_rub: 8000000 }
    - { max_dn_mm: 1400, cost_rub: 12000000 }
  technical_node: 0          # техузел отдельной стоимостью не тарифицируется
  # §8.3: штраф за каждый неподключённый ОКС = 100 млн + 500 тыс. × G, т/ч
  unconnected_penalty_base: 100000000
  unconnected_penalty_per_tph: 500000

# Раздел 9: итоговый показатель S = w_c·C/C0 + w_l·L/L0 (меньше — лучше).
scoring:
  weight_cost: 0.3
  weight_length: 0.7
  cost_norm_rub: 25000000    # 25 млн ₽
  length_norm_m: 100         # 100 м

# Правила алгоритма (не из техприложения — параметры решения).
rules:
  chamber_tap_max_dist_m: 10        # §8.2: камера ≤10 м и <4 примыканий — врезка в неё
  max_chamber_connections: 4        # §8.2: лимит примыкающих участков
  max_new_directions_per_chamber: 3 # из них в новых направлениях (ветвление)
  cluster_radius_m: 300             # радиус кластеризации ОКС под общий ствол
  tap_search_radius_m: 1500         # радиус поиска точек врезки
  grid_cell_m: 5                    # размер ячейки весовой сетки
  turn_penalty_m: 10                # штраф за поворот (в метрах эквивалента)
  corridor_avoid_radius_m: 30       # вариант «альтернативный коридор»
  corridor_avoid_factor: 3.0
  special_passage_min_len_m: 2      # короче — не выделять отдельным участком

# ============================================================================
# Раздел 6 (глубина, доп. задача): вертикальный профиль.
# Активируется ENGINE_DEPTH_MODE=1; в основной 2D-задаче (§8.1) глубины null.
# ============================================================================
depth:
  base_depth_m: 3.0          # базовая глубина до верха расчётного габарита
  min_depth_m: 0.7           # минимально допустимая глубина
  step_m: 0.5                # шаг дискретизации отметок
  max_slope: 0.10            # максимальный продольный уклон смены глубины (м/м)
  crossing_flat_m: 4.0       # горизонтальная площадка на точечном пересечении
  depth_cost_rate: 0.10      # Kгл = 1 + 0,10·(h − 3) при h > 3 м
  free_depth_m: 3.0          # до этой глубины Kгл = 1
  # условные глубины существующих коммуникаций (для выбора «выше/ниже»)
  existing_depth_m:
    gas_pipeline: 1.2
    power_cable: 0.8
    heat_network: 2.5
