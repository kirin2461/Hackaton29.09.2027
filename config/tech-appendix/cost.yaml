# ============================================================================
# Разделы 8–9 техприложения — стоимость камер/врезок/штрафов и ранжирование.
# ============================================================================
version: "tech-appendix-1.0"

tie_in_cost_rub: 5000000            # §8.2: каждая независимая врезка, не зависит от ДУ

# §8.2: новая камера и реконструкция существующей — ОДНА шкала;
# диаметр камеры = наибольший ДУ всех примыкающих участков в итоговом варианте.
# Реконструкция существующей камеры учитывается ОДИН раз независимо от числа врезок.
# Камеры, не используемые как точки врезки, не реконструируются и не тарифицируются.
chamber_cost_scale_rub:
  - { du_min: 50,   du_max: 200,  cost: 3000000 }
  - { du_min: 250,  du_max: 500,  cost: 5000000 }
  - { du_min: 600,  du_max: 1000, cost: 8000000 }
  - { du_min: 1200, du_max: 1400, cost: 12000000 }

# §8.2: врезка в существующую камеру, если она не далее 10 м И после подключения
# к ней примыкает ≤ max_sections_per_chamber участков; иначе — новая камера.
chamber_tie_in_max_distance_m: 10.0
max_sections_per_chamber: 4         # §3: 1 участок к источнику + не более 3 остальных

# §8.3: штраф за каждый неподключённый ОКС: fixed + per_tph * G_oks
unconnected_penalty:
  fixed_rub: 100000000
  per_tph_rub: 500000

# §9: S = cost_weight * C/base_cost + length_weight * L/base_length; меньше = лучше.
# L = новые участки + реконструируемые части существующей сети.
ranking:
  cost_weight: 0.7
  length_weight: 0.3
  base_cost_rub: 25000000
  base_length_m: 100

# §7: к реконструкции существующей сети Kспец и Kгл НЕ применяются;
# геометрия существующей сети не меняется, Cрек = Lрек * cрек(ДУтреб).
reconstruction:
  apply_k_special: false
  apply_k_depth: false
