# ============================================================================
# Раздел 6 (доп. задача по глубине) и §4.3 (параметры существующих коммуникаций).
# Поверхность земли — условная горизонтальная, Z = 0; глубина измеряется
# до ВЕРХА расчётного габарита новой сети.
# ============================================================================
version: "tech-appendix-1.0"

surface_z_m: 0.0
normal_depth_m: 3.0                 # обычная глубина новой сети
min_depth_m: 0.7
max_slope: 0.10                     # м/м: 1 м изменения глубины = ≥10 м по горизонтали

# Участок постоянной глубины в зоне пересечения (газ/кабель/сущ.теплосеть):
flat_section_at_crossing_m: 4.0     # по 2 м с каждой стороны точки пересечения

# Kгл = base + rate_per_m * (h - threshold_m), при h > threshold; иначе base.
# На спуске/подъёме — среднее арифметическое Kгл в начале и конце;
# при пересечении глубины 3.0 м — технический узел и разбивка участка.
k_depth:
  base: 1.0
  threshold_m: 3.0
  rate_per_m: 0.10

# §4.3: условные габариты и глубины существующих коммуникаций
existing_utilities:
  gas_pipeline: { width_m: 0.4, height_m: 0.4, depth_to_top_m: 2.8 }
  power_cable:  { width_m: 0.2, height_m: 0.2, depth_to_top_m: 2.7 }
  heat_network: { size: from_diameters_table, depth_to_top_m: 3.0 }  # габарит по ДУ из diameters.yaml
