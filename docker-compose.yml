# Синтаксис версии 2.4: совместим и с docker-compose 1.29.2 (требование ТЗ),
# и с compose plugin v2 (docker compose).
#
# Протокол 16.09.2026 п.1: вычислительное ядро — строго Java 11, внутри
# приложения (in-process); Python-sidecar исключён из поставки.
version: "2.4"

services:
  db:
    image: postgres:16
    container_name: heatnet-db
    environment:
      POSTGRES_DB: heatnet
      POSTGRES_USER: heatnet
      POSTGRES_PASSWORD: heatnet
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatnet"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    networks: [heatnet]
    # Порт БД наружу не публикуем

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: heatnet-app
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: heatnet
      DB_USER: heatnet
      DB_PASSWORD: heatnet
      EXCHANGE_DIR: /exchange
      # Движок in-process: куча под расчёт (3 ГБ вход — стриминг, не heap)
      JAVA_TOOL_OPTIONS: "-Xmx2048m"
    ports:
      - "8080:8080"
    volumes:
      - exchange:/exchange
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 3072m
    networks: [heatnet]

volumes:
  pgdata:
  exchange:

networks:
  heatnet:
    driver: bridge
